name: CI

on:
  push:
    branches:
      - main
      - master
      - '**'
  pull_request:
    branches:
      - main
      - master

jobs:
  web-admin-ci:
    name: Web Admin Lint, Test & Prod Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web-admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: src/web-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx ng test --watch=false

      - name: Build production bundle
        run: npx ng build --configuration=production

      - name: Scan repository for secrets
        run: node scripts/check-no-secrets.mjs

      - name: Check production bundle
        run: npm run check:prod-bundle

