name: CI

on:
  push:
    branches:
      - main
      - master
      - '**'
  pull_request:
    branches:
      - main
      - master

jobs:
  web-admin-ci:
    name: Web Admin Lint, Test & Prod Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web-admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: src/web-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx ng test --watch=false

      - name: Build production bundle
        run: npx ng build --configuration=production

      - name: Check production bundle
        run: npm run check:prod-bundle

  web-admin-e2e:
    name: Web Admin E2E & Accessibility (Chromium)
    runs-on: ubuntu-latest
    needs: web-admin-ci
    defaults:
      run:
        working-directory: src/web-admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: src/web-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run e2e -- --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/web-admin/playwright-report/
          retention-days: 7
