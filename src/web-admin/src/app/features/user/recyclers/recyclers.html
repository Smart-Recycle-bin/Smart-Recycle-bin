<div class="recyclers-page">
  <!-- Page Header -->
  <app-page-header
    title="Recyclers"
    subtitle="Moderate recycler accounts. Identity is masked for deleted users."
  />

  <!-- Filters Toolbar Card -->
  <div class="filters-card">
    <div class="filters-grid">
      <div class="filter-item search-filter">
        <app-search-input
          placeholder="Search by name, email, phone, or ID..."
          ariaLabel="Search recyclers"
          [value]="pagedList.filters().search || ''"
          (valueChange)="handleSearch($event)"
          (search)="handleSearch($event)"
        />
      </div>

      <div class="filter-item status-filter">
        <app-select
          [options]="statusOptions"
          [value]="pagedList.filters().status || ''"
          placeholder="All statuses"
          ariaLabel="Filter by status"
          (valueChange)="handleStatusChange($event)"
        />
      </div>
    </div>
  </div>

  <!-- Table or Error State -->
  @if (pagedList.error() && pagedList.items().length === 0) {
    <div class="error-container">
      <app-resource-state
        [error]="pagedList.error()"
        (retry)="pagedList.reload()"
      />
    </div>
  } @else {
    <div class="table-container">
      <app-data-table
        ariaLabel="Recycler accounts list"
        [columns]="tableColumns"
        [data]="pagedList.items()"
        [loading]="pagedList.refreshing() || pagedList.loading()"
        [actions]="tableActions"
        (actionClicked)="handleTableAction($event)"
        mode="server"
        [page]="pagedList.page()"
        [pageSize]="pagedList.pageSize()"
        [total]="pagedList.total()"
        [sortColumn]="pagedList.sortBy()"
        [sortDir]="pagedList.sortDir()"
        [showPagination]="true"
        (pageChange)="pagedList.setPage($event)"
        (sortChange)="pagedList.setSort($event.key, $event.dir)"
        emptyTitle="No recyclers found"
        emptyDescription="No recycler accounts match the search and status criteria."
      >
        <!-- Custom User Cell Template -->
        <ng-template appCell="name" let-row>
          <app-user-cell
            [name]="row.name"
            [subtitle]="row.userId"
          />
        </ng-template>

        <!-- Custom Available Points Cell Template -->
        <ng-template appCell="availablePoints" let-row>
          <app-number-cell
            [value]="(row.availablePoints | number:'1.0-0') ?? '0'"
          />
        </ng-template>

        <!-- Custom Lifetime Points Cell Template -->
        <ng-template appCell="lifetimePoints" let-row>
          <app-number-cell
            [value]="(row.lifetimePoints | number:'1.0-0') ?? '0'"
          />
        </ng-template>

        <!-- Custom Status Badge Cell Template -->
        <ng-template appCell="status" let-row>
          <app-badge
            [label]="getStatusLabel(row.status)"
            [variant]="getStatusBadgeVariant(row.status)"
            [dot]="true"
          />
        </ng-template>

        <!-- Custom Joined Date Cell Template -->
        <ng-template appCell="joinedAt" let-row>
          <span class="joined-date">{{ row.joinedAt | dateOnly }}</span>
        </ng-template>
      </app-data-table>
    </div>
  }

  <!-- Suspension Justification Modal -->
  <app-modal
    [open]="isSuspendModalOpen()"
    title="Suspend Recycler Account"
    description="Suspending an account temporarily revokes access to the mobile application and rewards redemption."
    size="md"
    (closed)="closeSuspendModal()"
  >
    <div class="modal-content">
      @if (selectedRecycler()) {
        <div class="target-user-info">
          <app-user-cell
            [name]="selectedRecycler()!.name"
            [subtitle]="selectedRecycler()!.userId + ' · ' + selectedRecycler()!.email"
          />
        </div>
      }

      <form [formGroup]="suspendForm" (ngSubmit)="confirmSuspend()" class="suspend-form">
        <app-textarea
          formControlName="reason"
          label="Reason for suspension"
          placeholder="Enter administrative justification for audit logs..."
          [required]="true"
          [rows]="3"
          [error]="suspendReasonError()"
        />
        <p class="audit-note">This action will be permanently recorded in the audit trail.</p>
      </form>
    </div>

    <div modal-footer class="modal-footer-actions">
      <app-button
        variant="ghost"
        (clicked)="closeSuspendModal()"
        [disabled]="isSubmitting()"
      >
        Cancel
      </app-button>
      <app-button
        variant="danger"
        (clicked)="confirmSuspend()"
        [loading]="isSubmitting()"
        [disabled]="suspendForm.invalid || isSubmitting()"
      >
        Suspend account
      </app-button>
    </div>
  </app-modal>

  <!-- Restore Access Confirmation Dialog -->
  <app-confirm-dialog
    [open]="isUnsuspendDialogOpen()"
    title="Restore Recycler Account"
    [description]="unsuspendDescription()"
    confirmText="Restore account"
    cancelText="Cancel"
    [danger]="false"
    [loading]="isSubmitting()"
    (confirmed)="confirmUnsuspend()"
    (cancelled)="closeUnsuspendDialog()"
  />
</div>
