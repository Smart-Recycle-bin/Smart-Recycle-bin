<div class="auth-root">
  <!-- Left Side: Auth Card -->
  <main class="auth-card-panel">
    <div class="auth-card fade-up">
      <div class="auth-logo-wrap">
        <ng-content select="[auth-logo]">
          @if (logoSrc()) {
            <img [src]="logoSrc()" [alt]="logoAlt()" class="auth-logo-img" />
          }
        </ng-content>
      </div>

      @if (title() || subtitle()) {
        <header class="auth-header">
          @if (title()) {
            <h1 class="auth-title">{{ title() }}</h1>
          }
          @if (subtitle()) {
            <p class="auth-subtitle">{{ subtitle() }}</p>
          }
        </header>
      }

      <div class="auth-content">
        <router-outlet />
      </div>
    </div>
  </main>

  <!-- Right Side: Projected Illustration / Tagline Panel -->
  <aside class="auth-aside-panel">
    <ng-content select="[auth-aside]">
      <div class="auth-aside-default">
        <div class="aside-illustration-placeholder" aria-hidden="true">
          <img [src]="logoSrc()" [alt]="logoAlt()" class="aside-logo-mark" />
        </div>
        <h2 class="aside-headline">
          Every bin, every kilo, <span class="aside-accent">accounted for.</span>
        </h2>
        <p class="aside-subcopy">
          Monitor the smart bin fleet, moderate accounts and keep the points ledger honest. Authorised administrators only.
        </p>
      </div>
    </ng-content>
  </aside>
</div>
