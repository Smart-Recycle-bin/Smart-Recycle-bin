<div class="admin-shell">
  <!-- Sidebar Container -->
  <div
    class="sidebar-wrapper"
    [class.is-mobile-open]="mobileSidebarOpen()"
  >
    @if (mobileSidebarOpen()) {
      <div class="mobile-backdrop" (click)="closeMobileSidebar()"></div>
    }

    <div class="sidebar-pane">
      <app-sidebar
        [sections]="navSections()"
        [collapsed]="sidebarCollapsed()"
        (toggleCollapse)="toggleCollapse()"
        (linkClicked)="closeMobileSidebar()"
      />
    </div>
  </div>

  <!-- Main Area -->
  <div class="admin-main">
    <app-topbar
      [notifications]="notifications()"
      [unreadNotifications]="unreadNotifications()"
      [userMenuItems]="userMenuItems"
      [userName]="activeUser()?.name ?? ''"
      [userRole]="activeUser()?.role ?? ''"
      [userAvatar]="activeUser()?.avatarUrl || ''"
      (toggleSidebar)="toggleMobileSidebar()"
      (notificationClicked)="loadNotifications()"
      (notificationItemClicked)="handleNotificationItemClick($event)"
      (notificationsMarkAllRead)="handleNotificationsMarkAllRead()"
      (userMenuAction)="handleUserMenuAction($event)"
    />

    <!-- Main Content -->
    <main class="admin-content">
      <router-outlet />
    </main>
  </div>
</div>
