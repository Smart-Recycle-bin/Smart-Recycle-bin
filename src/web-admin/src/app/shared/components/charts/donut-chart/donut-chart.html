<div class="donut-chart-container">
  @if (title()) {
    <div class="donut-header">
      <h4 class="donut-title">{{ title() }}</h4>
    </div>
  }

  @if (hasData()) {
    <div class="donut-layout">
      <div class="donut-svg-wrapper">
        <svg viewBox="0 0 100 100" class="donut-svg">
          <!-- Background track circle -->
          <circle
            cx="50"
            cy="50"
            [attr.r]="radius"
            fill="transparent"
            stroke="var(--soft)"
            [attr.stroke-width]="strokeWidth"
          />

          <!-- Segments -->
          <g transform="rotate(-90 50 50)">
            @for (seg of segments(); track seg.label) {
              <circle
                cx="50"
                cy="50"
                [attr.r]="radius"
                fill="transparent"
                [attr.stroke]="seg.color"
                [attr.stroke-width]="hoveredIndex() === seg.index ? strokeWidth + 2 : strokeWidth"
                [attr.stroke-dasharray]="seg.strokeDasharray"
                [attr.stroke-dashoffset]="seg.strokeDashoffset"
                class="donut-segment"
                [class.is-hovered]="hoveredIndex() === seg.index"
                (mouseenter)="onSegmentHover(seg.index)"
                (mouseleave)="onSegmentHover(null)"
              />
            }
          </g>

          <!-- Center Content -->
          <text
            x="50"
            y="47"
            text-anchor="middle"
            class="donut-center-value"
          >
            {{
              activeItem()
                ? activeItem()!.value + unit()
                : centerValue() !== null
                  ? centerValue()
                  : totalValue() + unit()
            }}
          </text>
          <text
            x="50"
            y="61"
            text-anchor="middle"
            class="donut-center-label"
          >
            {{ activeItem() ? activeItem()!.label : centerLabel() }}
          </text>
        </svg>
      </div>

      @if (showLegend()) {
        <div class="donut-legend">
          @for (seg of segments(); track seg.label) {
            <div
              class="legend-item"
              [class.is-highlighted]="hoveredIndex() === seg.index"
              (mouseenter)="onSegmentHover(seg.index)"
              (mouseleave)="onSegmentHover(null)"
            >
              <span class="legend-dot" [style.backgroundColor]="seg.color"></span>
              <span class="legend-label" [attr.title]="seg.label">{{ seg.label }}</span>
              <span class="legend-value">{{ seg.percentage }}%</span>
            </div>
          }
        </div>
      }
    </div>
  } @else {
    <div class="donut-empty">
      <span class="donut-empty-text">No segment data</span>
    </div>
  }
</div>
