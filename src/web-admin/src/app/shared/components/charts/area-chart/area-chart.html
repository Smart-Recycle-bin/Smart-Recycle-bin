<div class="area-chart-container">
  @if (title()) {
    <div class="chart-header">
      <h4 class="chart-title">{{ title() }}</h4>
    </div>
  }

  @if (hasData()) {
    <div class="chart-svg-box">
      <svg
        [attr.viewBox]="'0 0 ' + width + ' ' + height()"
        class="chart-svg"
        preserveAspectRatio="xMidYMid meet"
      >
        <defs>
          <linearGradient [id]="chartId" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" [attr.stop-color]="color()" stop-opacity="0.3" />
            <stop offset="100%" [attr.stop-color]="color()" stop-opacity="0.0" />
          </linearGradient>
        </defs>

        @if (showGrid()) {
          @for (grid of gridLines(); track grid.y) {
            <line
              [attr.x1]="padLeft"
              [attr.y1]="grid.y"
              [attr.x2]="width - padRight"
              [attr.y2]="grid.y"
              class="grid-line"
            />
            <text
              [attr.x]="padLeft - 8"
              [attr.y]="grid.y + 4"
              text-anchor="end"
              class="axis-label"
            >
              {{ grid.val }}
            </text>
          }
        }

        <!-- Filled area -->
        <path [attr.d]="areaPath()" [attr.fill]="'url(#' + chartId + ')'" />

        <!-- Line stroke -->
        <path
          [attr.d]="linePath()"
          fill="none"
          [attr.stroke]="color()"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <!-- X labels and points -->
        @for (pt of points(); track pt.index) {
          <!-- X axis label for first, middle, last points -->
          @if (pt.index === 0 || pt.index === points().length - 1 || pt.index === Math.floor(points().length / 2)) {
            <text
              [attr.x]="pt.x"
              [attr.y]="height() - 8"
              [attr.text-anchor]="pt.index === 0 ? 'start' : (pt.index === points().length - 1 ? 'end' : 'middle')"
              class="axis-label"
            >
              {{ pt.item.label }}
            </text>
          }

          <!-- Invisible wider hit area for hover -->
          <circle
            [attr.cx]="pt.x"
            [attr.cy]="pt.y"
            r="12"
            fill="transparent"
            class="hover-trigger"
            (mouseenter)="onPointHover(pt.index)"
            (mouseleave)="onPointHover(null)"
          />

          <!-- Point circle visible on hover -->
          <circle
            [attr.cx]="pt.x"
            [attr.cy]="pt.y"
            [attr.r]="hoveredIndex() === pt.index ? 5 : 3"
            [attr.fill]="hoveredIndex() === pt.index ? color() : 'var(--card)'"
            [attr.stroke]="color()"
            stroke-width="2"
            class="point-circle"
            [class.is-hovered]="hoveredIndex() === pt.index"
          />
        }

        <!-- Tooltip overlay -->
        @if (hoveredPoint()) {
          <g [attr.transform]="'translate(' + hoveredPoint()!.x + ',' + (hoveredPoint()!.y - 32) + ')'" class="chart-tooltip">
            <rect
              x="-40"
              y="-12"
              width="80"
              height="24"
              rx="4"
              class="tooltip-bg"
            />
            <text
              x="0"
              y="4"
              text-anchor="middle"
              class="tooltip-text"
            >
              {{ hoveredPoint()!.item.value }}{{ unit() }}
            </text>
          </g>
        }
      </svg>
    </div>
  } @else {
    <div class="chart-empty">
      <span class="chart-empty-text">No chart data available</span>
    </div>
  }
</div>
