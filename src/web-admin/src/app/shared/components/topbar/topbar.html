<header class="topbar-root">
  <!-- Left: Mobile Sidebar Toggle + Search -->
  <div class="topbar-start">
    <button
      type="button"
      class="mobile-menu-btn"
      aria-label="Toggle navigation menu"
      (click)="handleToggleSidebar()"
    >
      <app-icon name="menu" size="md" />
    </button>

    @if (showSearch()) {
      <div class="topbar-search">
        <app-search-input
          [placeholder]="searchPlaceholder()"
          size="sm"
          (search)="handleSearch($event)"
          (valueChange)="handleSearchChange($event)"
        />
      </div>
    }
  </div>

  <!-- Right: Theme Toggle, Notifications Bell, User Block -->
  <div class="topbar-end">
    <button
      type="button"
      class="topbar-action-btn theme-toggle"
      [attr.title]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
      (click)="toggleTheme()"
    >
      <app-icon [name]="isDarkMode() ? 'sun' : 'moon'" size="sm" />
    </button>

    <button
      type="button"
      class="topbar-action-btn notif-btn"
      title="Notifications"
      aria-label="View notifications"
      (click)="handleNotification()"
    >
      <app-icon name="bell" size="sm" />
      @if (unreadNotifications() > 0) {
        <span class="notif-badge">
          {{ unreadNotifications() > 9 ? '9+' : unreadNotifications() }}
        </span>
      }
    </button>

    <div class="user-menu-wrapper">
      <button
        type="button"
        class="user-trigger-btn"
        (click)="toggleUserMenu()"
        aria-label="User menu"
        [attr.aria-expanded]="userMenuOpen()"
      >
        <app-avatar
          [name]="userName() || 'User'"
          [imageUrl]="userAvatar()"
          size="sm"
        />
        @if (userName() || userRole()) {
          <span class="user-meta">
            @if (userName()) {
              <span class="user-display-name">{{ userName() }}</span>
            }
            @if (userRole()) {
              <span class="user-display-role">{{ userRole() }}</span>
            }
          </span>
        }
      </button>

      @if (userMenuOpen()) {
        <div class="user-dropdown-menu fade-up" role="menu" (click)="$event.stopPropagation()">
          @if (userName() || userRole()) {
            <div class="dropdown-header">
              <span class="dropdown-user-name">{{ userName() }}</span>
              <span class="dropdown-user-role">{{ userRole() }}</span>
            </div>
            <div class="dropdown-divider"></div>
          }
          @for (item of userMenuItems(); track item.id) {
            @if (item.dividerBefore) {
              <div class="dropdown-divider"></div>
            }
            <button
              type="button"
              role="menuitem"
              [class]="'dropdown-item' + (item.danger ? ' is-danger' : '')"
              (click)="selectMenuItem(item)"
            >
              @if (item.icon) {
                <app-icon [name]="item.icon" size="xs" />
              }
              <span>{{ item.label }}</span>
            </button>
          }
        </div>
      }
    </div>
  </div>
</header>
