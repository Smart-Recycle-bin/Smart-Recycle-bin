<app-form-field
  [label]="label()"
  [forId]="id()"
  [required]="required()"
  [disabled]="internalDisabled()"
>
  <div
    class="textarea-wrapper"
    [class.has-error]="!!effectiveError()"
    [class.is-disabled]="internalDisabled()"
  >
    <textarea
      [id]="id()"
      [rows]="rows()"
      [value]="internalValue()"
      [placeholder]="placeholder()"
      [disabled]="internalDisabled()"
      [required]="required()"
      [attr.maxlength]="maxLength()"
      [attr.aria-invalid]="!!effectiveError()"
      (input)="handleInput($event)"
      (blur)="handleBlur()"
      class="textarea-field"
    ></textarea>
  </div>

  <div class="textarea-footer">
    <div class="textarea-messages">
      @if (effectiveError()) {
        <p class="textarea-error-msg" role="alert">{{ effectiveError() }}</p>
      } @else if (hint()) {
        <p class="textarea-hint-msg">{{ hint() }}</p>
      }
    </div>

    @if (maxLength()) {
      <span class="textarea-counter" [class.is-limit]="charCount() >= maxLength()!">
        {{ charCount() }} / {{ maxLength() }}
      </span>
    }
  </div>
</app-form-field>
