<app-form-field
  [label]="label()"
  [forId]="id()"
  [required]="required()"
  [hint]="hint()"
  [error]="effectiveError()"
  [disabled]="internalDisabled()"
>
  <div
    class="number-wrapper"
    [class.has-error]="!!effectiveError()"
    [class.is-disabled]="internalDisabled()"
  >
    <input
      type="number"
      [id]="id()"
      [value]="displayValue()"
      [placeholder]="placeholder()"
      [attr.min]="min()"
      [attr.max]="max()"
      [attr.step]="step()"
      [disabled]="internalDisabled()"
      [required]="required()"
      [attr.aria-invalid]="!!effectiveError()"
      (input)="handleInput($event)"
      (blur)="handleBlur()"
      class="number-field"
      [class.has-suffix]="!!suffix()"
    />
    @if (suffix()) {
      <span class="number-suffix">{{ suffix() }}</span>
    }
  </div>
</app-form-field>
