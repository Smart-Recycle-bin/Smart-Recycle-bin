<label
  [for]="id()"
  class="checkbox-container"
  [class.is-disabled]="disabled()"
  [class.is-checked]="checked()"
>
  <span class="checkbox-box-wrapper">
    <input
      #nativeInput
      type="checkbox"
      [id]="id()"
      [checked]="checked()"
      [disabled]="disabled()"
      (change)="handleChange($event)"
      class="checkbox-native"
    />
    <span class="checkbox-custom" aria-hidden="true">
      @if (indeterminate()) {
        <span class="indeterminate-bar"></span>
      } @else if (checked()) {
        <app-icon name="check" size="xs" color="#ffffff" [strokeWidth]="3" />
      }
    </span>
  </span>

  @if (label() || description()) {
    <span class="checkbox-text-group">
      @if (label()) {
        <span class="checkbox-label">{{ label() }}</span>
      }
      @if (description()) {
        <span class="checkbox-desc">{{ description() }}</span>
      }
    </span>
  }
</label>
