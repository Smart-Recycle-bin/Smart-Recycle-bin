@if (open()) {
  <div
    class="modal-backdrop"
    (click)="handleBackdropClick($event)"
  >
    <div
      [class]="'modal-dialog size-' + size() + ' slide-in'"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="ariaLabel() || (title() ? null : 'Dialog')"
      [attr.aria-labelledby]="title() ? titleId : null"
      [attr.aria-describedby]="description() ? descId : null"
      [appFocusTrap]="true"
      (escapePressed)="close()"
    >
      @if (title() || showCloseButton()) {
        <div class="modal-header">
          <div class="modal-titles">
            @if (title()) {
              <h3 class="modal-title" [id]="titleId">{{ title() }}</h3>
            }
            @if (description()) {
              <p class="modal-desc" [id]="descId">{{ description() }}</p>
            }
          </div>

          @if (showCloseButton()) {
            <app-icon-button
              icon="x"
              size="sm"
              variant="ghost"
              ariaLabel="Close modal"
              (clicked)="close()"
            />
          }
        </div>
      }

      <div class="modal-body">
        <ng-content />
      </div>

      <div class="modal-footer">
        <ng-content select="[modal-footer]" />
      </div>
    </div>
  </div>
}
