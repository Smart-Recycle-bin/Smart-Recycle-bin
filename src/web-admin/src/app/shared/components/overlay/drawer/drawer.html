@if (open()) {
  <div
    class="drawer-backdrop"
    (click)="handleBackdropClick($event)"
  >
    <div
      [class]="'drawer-panel position-' + position() + ' size-' + size()"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="ariaLabel() || (title() ? null : 'Drawer')"
      [attr.aria-labelledby]="title() ? titleId : null"
      [attr.aria-describedby]="description() ? descId : null"
      [appFocusTrap]="true"
      (escapePressed)="close()"
    >
      <div class="drawer-header">
        <div class="drawer-titles">
          @if (title()) {
            <h3 class="drawer-title" [id]="titleId">{{ title() }}</h3>
          }
          @if (description()) {
            <p class="drawer-desc" [id]="descId">{{ description() }}</p>
          }
        </div>

        <app-icon-button
          icon="x"
          size="sm"
          variant="ghost"
          ariaLabel="Close drawer"
          (clicked)="close()"
        />
      </div>

      <div class="drawer-body">
        <ng-content />
      </div>

      <div class="drawer-footer">
        <ng-content select="[drawer-footer]" />
      </div>
    </div>
  </div>
}
