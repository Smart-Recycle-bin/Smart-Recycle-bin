<aside [class]="'sidebar-root' + (collapsed() ? ' is-collapsed' : '')">
  <!-- Brand Header -->
  <div class="sidebar-brand">
    <div class="brand-logo">
      <app-icon name="recycle" size="md" color="#ffffff" />
    </div>

    @if (!collapsed()) {
      <div class="brand-info">
        <h2 class="brand-name">{{ appName() }}</h2>
        <span class="brand-subtitle">{{ appSubtitle() }}</span>
      </div>
    }

    <button
      type="button"
      class="collapse-btn"
      (click)="handleToggleCollapse()"
      [attr.title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <app-icon [name]="collapsed() ? 'chevron-right' : 'chevron-left'" size="xs" />
    </button>
  </div>

  <!-- Navigation Sections -->
  <nav class="sidebar-nav">
    @for (sec of sections(); track sec.title || $index) {
      <div class="nav-section">
        @if (sec.title && !collapsed()) {
          <h3 class="section-title">{{ sec.title }}</h3>
        }

        <ul class="nav-list">
          @for (item of sec.items; track item.id) {
            <li class="nav-list-item">
              <button
                type="button"
                [class]="'nav-link' + (activeId() === item.id ? ' is-active' : '')"
                [attr.title]="collapsed() ? item.label : null"
                (click)="handleItemClick(item)"
              >
                <div class="nav-icon">
                  <app-icon [name]="item.icon" size="sm" />
                </div>

                @if (!collapsed()) {
                  <span class="nav-label">{{ item.label }}</span>

                  @if (item.badge) {
                    <div class="nav-badge">
                      <app-badge [variant]="item.badgeVariant || 'neutral'" size="sm">
                        {{ item.badge }}
                      </app-badge>
                    </div>
                  }
                }
              </button>
            </li>
          }
        </ul>
      </div>
    }
  </nav>

  <!-- User profile footer -->
  <div class="sidebar-footer">
    <div class="user-profile">
      <app-avatar
        [name]="user().name"
        [imageUrl]="user().avatarUrl"
        size="sm"
        status="online"
      />

      @if (!collapsed()) {
        <div class="user-meta">
          <span class="user-name">{{ user().name }}</span>
          <span class="user-role">{{ user().role || user().email }}</span>
        </div>

        <button
          type="button"
          class="logout-btn"
          title="Sign out"
          aria-label="Sign out"
          (click)="handleLogout()"
        >
          <app-icon name="log-out" size="xs" />
        </button>
      }
    </div>
  </div>
</aside>
